name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update

      - name: Get Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build mapping
        shell: bash
        run: |
          set -euo pipefail
          lake build JPAIGuidelinesMapping

      - name: Verify source with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true JPAIGuidelinesMapping.lean

      - name: Verify AISI assurance case with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true AISICompositionalAssuranceCase.lean

      - name: Record verification basis
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Public abstract assurance verification'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            echo 'The mapping build and both warnings-as-errors source checks succeeded in this run.'
            echo 'Scope: public formalization only; not operational safety or AISI certification.'
            echo
            echo '### Toolchain and source hashes'
            echo '```text'
            lake env lean --version
            sha256sum JPAIGuidelinesMapping.lean AISICompositionalAssuranceCase.lean lakefile.toml lean-toolchain
            echo '```'
            echo
            echo '### Resolved dependencies'
            echo '```json'
            cat lake-manifest.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
